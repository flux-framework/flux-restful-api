name: Test flux-restful-api

on:
  pull_request:

jobs:
  prepare-container:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.extract_branch.outputs.branch }}
    steps:
    - name: Extract branch name
      run: echo "branch=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_OUTPUT
      id: extract_branch

  test:
    runs-on: ubuntu-latest
    needs: [prepare-container]
    container:
      image: ghcr.io/flux-framework/flux-restful-api:latest
      ports:
       - 5000
      env:
        FLUX_SECRET_KEY: notsosecrethoo
        FLUX_USER: fluxuser
        FLUX_TOKEN: "12345"
    steps:
    - uses: actions/checkout@v3
    - name: Install Dependencies (in case changes)
      run: |
        pip install -r requirements.txt -r .github/dev-requirements.txt
        # This checkout as a package (server and client)
        pip install --no-deps -e .

    - name: Run tests
      run: |
        pip freeze
        # Tests for the API with auth disabled
        flux start pytest -xs tests/

        # Create main user in database (via the module: pip may put the
        # flux-restful console script outside PATH in this container)
        export FLUX_USER=fluxuser
        export FLUX_TOKEN=12345

        python3 -m flux_restful.cli init

        # Require auth and shared secret key
        export FLUX_SECRET_KEY=notsosecrethoo
        export FLUX_TOKEN_SIGNING_KEY=signingkeyfortests
        export FLUX_REQUIRE_AUTH=true
        export TEST_AUTH=true

        # This needs to be run as the flux instance owner
        # E.g., if it's flux
        # sudo -u flux flux start pytest -xs tests/
        whoami
        # The tests create users, so the database (and the directory, for
        # the sqlite journal) must be writable by that user
        chown -R fluxuser .
        sudo -u fluxuser flux start pytest -xs tests/
