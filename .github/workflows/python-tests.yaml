name: Test Python flux-restful-api

on:
  push:
    branches-ignore:
    - main
    - gh-pages

jobs:
  # Run the Python client's tests against a server built from this checkout
  client:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Build the server image from this checkout
      run: docker build -t flux-restful-api:test .

    - name: Install the package (server and client) and test tools
      run: |
        pip install -r requirements.txt -r .github/dev-requirements.txt
        pip install --no-deps -e .

    - name: Test without auth
      run: |
        docker run -d --name api -p 5000:5000 flux-restful-api:test
        # Wait for the server; fail fast with its logs if the container dies
        for i in $(seq 1 60); do
          curl -sf http://localhost:5000/v1/auth && break
          if [ "$(docker inspect -f '{{.State.Running}}' api)" != "true" ]; then
            echo "server container exited"; docker logs api; exit 1
          fi
          sleep 2
        done
        curl -sf http://localhost:5000/v1/auth || { echo "server did not come up"; docker logs api; exit 1; }
        FLUX_RESTFUL_HOST=http://localhost:5000 pytest -xs tests/e2e || { docker logs api; exit 1; }
        docker rm -f api

    - name: Test with auth
      run: |
        docker run -d --name api -p 5000:5000 \
          -e FLUX_REQUIRE_AUTH=true -e FLUX_USER=fluxuser -e FLUX_TOKEN=12345 \
          -e FLUX_SECRET_KEY=notsecrethoo \
          flux-restful-api:test
        # Wait for the server; fail fast with its logs if the container dies
        for i in $(seq 1 60); do
          curl -sf http://localhost:5000/v1/auth && break
          if [ "$(docker inspect -f '{{.State.Running}}' api)" != "true" ]; then
            echo "server container exited"; docker logs api; exit 1
          fi
          sleep 2
        done
        curl -sf http://localhost:5000/v1/auth || { echo "server did not come up"; docker logs api; exit 1; }
        export FLUX_USER=fluxuser
        export FLUX_TOKEN=12345
        export FLUX_SECRET_KEY=notsecrethoo
        FLUX_RESTFUL_HOST=http://localhost:5000 pytest -xs tests/e2e || { docker logs api; exit 1; }
        docker rm -f api
